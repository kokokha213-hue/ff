<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#071120" />
<title>RAXI WIN PREDICTOR 4.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #071120;
    color: #e2e8f0;
    overflow-x: hidden;
    margin: 0;
    padding: 0;
  }
  .bg-mesh {
    background:
      radial-gradient(circle at 20% 10%, rgba(56,189,248,0.15), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(99,102,241,0.15), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(15,23,42,0.9), #050a14);
    min-height: 100vh;
  }
  .glass {
    background: linear-gradient(145deg, rgba(15,23,42,0.85), rgba(7,17,32,0.9));
    border: 1px solid rgba(56,189,248,0.25);
    backdrop-filter: blur(10px);
    border-radius: 20px;
  }
  .glass-sub {
    background: linear-gradient(145deg, rgba(15,23,42,0.6), rgba(7,17,32,0.7));
    border: 1px solid rgba(56,189,248,0.18);
    border-radius: 16px;
  }
  .btn-amber {
    background: linear-gradient(90deg, #fbbf24, #f59e0b, #facc15);
    color: #0f172a;
    font-weight: 800;
    box-shadow: 0 0 20px rgba(245,158,11,0.45);
    transition: all .15s;
    cursor: pointer;
    border: none;
  }
  .btn-amber:active { transform: scale(0.97); }
  .btn-amber:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sky {
    background: linear-gradient(90deg, #0ea5e9, #3b82f6, #6366f1);
    color: white;
    font-weight: 800;
    cursor: pointer;
    border: none;
  }
  .keypad {
    background: linear-gradient(145deg, rgba(15,23,42,0.9), rgba(7,17,32,0.95));
    border: 1px solid rgba(56,189,248,0.25);
    color: white;
    font-weight: 700;
    font-size: 22px;
    height: 56px;
    border-radius: 16px;
    transition: all .1s;
    cursor: pointer;
    user-select: none;
    font-family: inherit;
  }
  .keypad:active {
    border-color: #fbbf24;
    transform: scale(0.96);
  }
  .keypad:disabled { opacity: 0.4; pointer-events: none; }
  @keyframes pulse-ring {
    0%,100% { opacity: .6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  @keyframes radar {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .animate-fade-in { animation: fade-in .35s ease-out; }
  .radar-spin { animation: radar 6s linear infinite; }
  .pulse-ring { animation: pulse-ring 2s ease-in-out infinite; }
  .spin { animation: spin 1s linear infinite; }
  .glow-amber { text-shadow: 0 0 10px rgba(245,158,11,0.7); }
  .glow-sky { text-shadow: 0 0 10px rgba(56,189,248,0.7); }
  .num-img {
    width: 110px; height: 110px;
    object-fit: contain;
    filter: drop-shadow(0 0 22px rgba(245,158,11,0.75));
    transition: transform .2s;
  }
  .bs-img {
    width: 130px; height: 130px;
    object-fit: contain;
    filter: drop-shadow(0 0 22px rgba(56,189,248,0.75));
  }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15,23,42,0.95);
    border: 1px solid rgba(56,189,248,0.5);
    color: #e2e8f0;
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    z-index: 9999;
    animation: fade-in .3s ease;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    max-width: 90%;
  }
</style>
</head>
<body>
<div id="app" class="bg-mesh"></div>

<script>
/* =========================================================
   LOCAL STORAGE DB (No server needed)
   ========================================================= */
const DB = {
  CONFIG_KEY: "raxi_config_v1",
  USERS_KEY: "raxi_users_v1",
  PRED_KEY: "raxi_predictions_v1",
  DEVICE_KEY: "raxi_device_id",
  SESSION_KEY: "raxi_session_v1",

  getConfig() {
    try {
      const c = JSON.parse(localStorage.getItem(this.CONFIG_KEY));
      if (c) return c;
    } catch(e){}
    const def = {
      targetAccuracy: 96.8,
      activeMembersDisplay: "12.8K+",
      todayWinsDisplay: 44,
      numberPredictionLocked: false,
      bigSmallPredictionLocked: false,
      masterKey: "REAL",
      defaultUID: "705086"
    };
    localStorage.setItem(this.CONFIG_KEY, JSON.stringify(def));
    return def;
  },
  saveConfig(c) {
    localStorage.setItem(this.CONFIG_KEY, JSON.stringify(c));
  },
  getUsers() {
    try { return JSON.parse(localStorage.getItem(this.USERS_KEY)) || {}; }
    catch { return {}; }
  },
  saveUsers(u) { localStorage.setItem(this.USERS_KEY, JSON.stringify(u)); },
  getPredictions() {
    try { return JSON.parse(localStorage.getItem(this.PRED_KEY)) || []; }
    catch { return []; }
  },
  savePredictions(p) {
    localStorage.setItem(this.PRED_KEY, JSON.stringify(p.slice(0, 500)));
  },
  getDeviceId() {
    let id = localStorage.getItem(this.DEVICE_KEY);
    if (!id) {
      id = "DEV_" + Math.random().toString(36).slice(2, 10).toUpperCase() + "_" + Date.now().toString(36).toUpperCase();
      localStorage.setItem(this.DEVICE_KEY, id);
    }
    return id;
  },
  getSession() {
    try { return JSON.parse(localStorage.getItem(this.SESSION_KEY)); }
    catch { return null; }
  },
  setSession(s) {
    if (s) localStorage.setItem(this.SESSION_KEY, JSON.stringify(s));
    else localStorage.removeItem(this.SESSION_KEY);
  },
  clearSession() { localStorage.removeItem(this.SESSION_KEY); }
};

/* =========================================================
   FAKE API (Works offline, no fetch)
   ========================================================= */
const API = {
  async unlock(code) {
    await sleep(400);
    const cfg = DB.getConfig();
    const entered = String(code || "").trim().toUpperCase();
    const master = String(cfg.masterKey || "REAL").toUpperCase();
    const defUID = String(cfg.defaultUID || "705086").toUpperCase();

    if (entered === master || entered === defUID) {
      const uid = cfg.defaultUID || "705086";
      const users = DB.getUsers();
      if (!users[uid]) {
        users[uid] = {
          uid,
          status: "approved",
          vipTier: "VIP_PLATINUM",
          winRate: 96.8,
          totalWins: 0,
          createdAt: new Date().toISOString()
        };
      }
      DB.saveUsers(users);
      DB.setSession({ uid, ts: Date.now() });
      return {
        success: true,
        user: {
          uid,
          status: "approved",
          vipTier: users[uid].vipTier,
          winRate: users[uid].winRate,
          totalWins: users[uid].totalWins
        }
      };
    }
    return { success: false, error: "❌ Invalid Code! Type REAL to unlock" };
  },

  async savePrediction(data) {
    await sleep(150);
    const list = DB.getPredictions();
    list.unshift({
      id: "P_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      ...data,
      timestamp: Date.now()
    });
    DB.savePredictions(list);

    const users = DB.getUsers();
    if (users[data.uid]) {
      if (data.isWin) users[data.uid].totalWins = (users[data.uid].totalWins || 0) + 1;
      users[data.uid].lastActive = new Date().toISOString();
      DB.saveUsers(users);
    }
    return { success: true };
  },

  async getStats(uid) {
    await sleep(80);
    const list = DB.getPredictions().filter(p => p.uid === uid);
    const wins = list.filter(p => p.isWin).length;
    return {
      total: list.length,
      wins,
      winRate: list.length ? ((wins / list.length) * 100).toFixed(1) : 0
    };
  },

  async getLiveStats() {
    await sleep(80);
    const cfg = DB.getConfig();
    const preds = DB.getPredictions();
    const wins = preds.filter(p => p.isWin).length;
    return {
      totalPredictions: preds.length,
      todayWins: wins || cfg.todayWinsDisplay,
      accuracy: preds.length ? ((wins / preds.length) * 100).toFixed(1) : cfg.targetAccuracy,
      activeMembersDisplay: cfg.activeMembersDisplay,
      targetAccuracy: cfg.targetAccuracy
    };
  }
};

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* =========================================================
   AUDIO
   ========================================================= */
const Audio = {
  ctx: null, muted: false,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  tone(freq, dur, type = "sine", vol = 0.12) {
    if (this.muted) return;
    try {
      this.init(); if (!this.ctx) return;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, this.ctx.currentTime);
      g.gain.setValueAtTime(vol, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + dur);
    } catch(e){}
  },
  click(){ this.tone(800, .05, "sine", .1); },
  keypad(){ this.tone(700, .04, "triangle", .12); },
  error(){ this.tone(180, .25, "sawtooth", .15); },
  radar(){
    if (this.muted) return;
    try {
      this.init(); if (!this.ctx) return;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(220, this.ctx.currentTime);
      o.frequency.linearRampToValueAtTime(880, this.ctx.currentTime + .18);
      g.gain.setValueAtTime(.08, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, this.ctx.currentTime + .2);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + .2);
    } catch(e){}
  },
  success(){
    if (this.muted) return;
    try {
      this.init(); if (!this.ctx) return;
      const t = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(f, t + i*.08);
        g.gain.setValueAtTime(0, t + i*.08);
        g.gain.linearRampToValueAtTime(.15, t + i*.08 + .02);
        g.gain.exponentialRampToValueAtTime(.001, t + i*.08 + .3);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(t + i*.08); o.stop(t + i*.08 + .35);
      });
    } catch(e){}
  },
  toggle(){ this.muted = !this.muted; return this.muted; }
};

/* =========================================================
   STATE
   ========================================================= */
let state = {
  page: "uid",
  user: null,
  config: DB.getConfig(),
  code: "",
  period: "",
  mode: "number",
  prediction: null,
  loading: false,
  muted: false,
  error: "",
  stats: { total: 0, wins: 0, winRate: 0 },
  liveStats: null
};

const NUMBER_IMAGES = {
  0:"https://i.ibb.co/whKvd1bL/1776870264510.png",
  1:"https://i.ibb.co/GfmHk799/1776870297250.png",
  2:"https://i.ibb.co/zVrbGJ0H/1776870331500.png",
  3:"https://i.ibb.co/JFxdJCjb/1776870358256.png",
  4:"https://i.ibb.co/Z7N213k/1776870391192.png",
  5:"https://i.ibb.co/WNDx2qbx/1776870425087.png",
  6:"https://i.ibb.co/GQ04Y4Ds/1776870455662.png",
  7:"https://i.ibb.co/DPP7TJ95/1776870488109.png",
  8:"https://i.ibb.co/sdSgFGXj/1776870514631.png",
  9:"https://i.ibb.co/Xx401f6w/1776870543380.png"
};

const SMALL_IMG = "https://i.ibb.co/pBcDXRFm/1776870218135.png";

const app = document.getElementById("app");

function colorForNumber(n) {
  if (n === 0 || n === 5) return "violet";
  if ([1,3,7,9].includes(n)) return "green";
  return "red";
}

function toast(msg, ms = 2200) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* =========================================================
   UID PAGE
   ========================================================= */
function renderUID() {
  app.innerHTML = `
    <div class="w-full max-w-md mx-auto px-4 py-8 flex flex-col items-center justify-center min-h-screen animate-fade-in">
      <div class="flex flex-col items-center space-y-3 mb-8">
        <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-slate-900 border border-slate-700 text-[11px] font-bold tracking-widest text-slate-200">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>PREMIUM VIP BOT</span>
        </div>
        <h1 class="text-3xl font-black tracking-widest text-white glow-amber text-center">⌒ RAXI WIN ⌒</h1>
        <h2 class="text-2xl font-extrabold tracking-widest text-amber-300 glow-amber">PREDICTOR 4.0</h2>
        <p class="text-[10px] tracking-[0.2em] text-slate-400 uppercase text-center px-4">
          INDIA'S #1 AI COLOR & NUMBER PREDICTION SYSTEM
        </p>

      <div class="relative w-48 h-48 flex items-center justify-center mb-8">
        <div class="absolute w-44 h-44 rounded-full border border-dashed border-slate-400/50 radar-spin"></div>
        <div class="absolute w-36 h-36 rounded-full border border-slate-600/40 pulse-ring"></div>
        <div class="absolute w-28 h-28 rounded-full border border-slate-300/70" style="box-shadow: 0 0 30px rgba(203,213,225,0.4)"></div>

          </svg>
        </div>
      </div>

      <div class="w-full glass p-5 space-y-4">
        <div class="text-center space-y-1">
          <h3 class="text-base font-extrabold text-white tracking-wider uppercase">Enter Access Code</h3>
          <p class="text-xs text-slate-400 font-semibold">Type <span class="text-amber-300 font-bold">REAL</span> to unlock predictor</p>
        </div>
        <input id="codeInput" type="text" value="${state.code}" placeholder="TYPE REAL..." autocomplete="off"
          class="w-full h-14 rounded-2xl bg-[#081528] border border-sky-500/40 text-center text-amber-300 font-mono text-2xl tracking-[0.3em] uppercase outline-none focus:border-amber-400" />
        ${state.error ? `<p class="text-xs text-rose-400 font-bold text-center">${state.error}</p>` : ""}
        <button id="unlockBtn" class="btn-amber w-full py-3.5 rounded-2xl text-sm uppercase tracking-wider">
          🔓 UNLOCK PREDICTOR
        </button>
        <p class="text-[10px] text-slate-500 text-center font-mono">Master Code: REAL · Default UID: 705086</p>
      </div>

      <p class="text-[10px] text-slate-500 mt-6 font-mono uppercase tracking-wider">RAXI WIN PREDICTOR HACK 4.0</p>
    </div>
  `;

  const input = document.getElementById("codeInput");
  input.addEventListener("input", (e) => {
    state.code = e.target.value.toUpperCase();
    state.error = "";
    input.value = state.code;
    Audio.keypad();
  });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
  document.getElementById("unlockBtn").addEventListener("click", unlock);
  setTimeout(() => input.focus(), 100);
}

async function unlock() {
  const code = state.code.trim().toUpperCase();
  if (!code) { Audio.error(); return; }

  const btn = document.getElementById("unlockBtn");
  if (btn) { btn.disabled = true; btn.textContent = "⏳ UNLOCKING..."; }
  Audio.click();

  const res = await API.unlock(code);
  if (res && res.success) {
    Audio.success();
    state.user = res.user;
    state.page = "predictor";
    state.error = "";
    state.period = "";
    state.prediction = null;
    const [stats, live] = await Promise.all([API.getStats(res.user.uid), API.getLiveStats()]);
    if (stats) state.stats = stats;
    if (live) state.liveStats = live;
    render();
  } else {
    Audio.error();
    state.error = res?.error || "❌ Invalid Code!";
    render();
  }
}

/* =========================================================
   PREDICTOR PAGE
   ========================================================= */

  const isNumber = state.mode === "number";
  const locked = (isNumber && state.config.numberPredictionLocked) ||
                 (!isNumber && state.config.bigSmallPredictionLocked);

  const live = state.liveStats || {};

  let resultHTML = "";
  if (state.loading) {
    resultHTML = `
      <div class="flex flex-col items-center space-y-3 py-4">
        <div class="w-24 h-24 rounded-full border border-sky-400/40 flex items-center justify-center">

            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
        </div>
        <span class="text-xs font-bold text-sky-300 tracking-widest uppercase animate-pulse">COMPUTING VIP SURESHOT...</span>
      </div>`;
  } else if (p) {
    if (isNumber) {
      resultHTML = `
        <div class="flex flex-col items-center animate-fade-in">
          <img src="${NUMBER_IMAGES[p.predictedNumber]}" class="num-img" alt="Number ${p.predictedNumber}" />

        </div>`;
    }
  } else {
    resultHTML = `
      <div class="flex flex-col items-center justify-center py-4 space-y-2 opacity-75">
        <div class="w-14 h-14 rounded-full border-2 border-dashed border-sky-400/60 flex items-center justify-center bg-sky-950/30">
          <span class="text-xl font-bold text-sky-300">?</span>
        </div>
        <span class="text-[11px] text-slate-300 uppercase tracking-wider font-bold">Enter 4-Digit Period Below</span>
      </div>`;
  }

  app.innerHTML = `
    <div class="w-full max-w-md mx-auto px-4 py-4 flex flex-col min-h-screen animate-fade-in">
      <div class="flex items-center justify-between mb-3">

          <span>Exit</span>
        </button>
        <div class="flex items-center space-x-2">
          <div class="flex items-center space-x-1.5 px-3 py-1 rounded-full bg-[#0a1526]/90 border border-sky-500/35 text-sky-200 text-[11px] font-bold">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>UID: ${state.user?.uid || "705086"}</span>
          </div>
          <button id="muteBtn" class="glass-sub px-2 py-1.5 text-slate-300 text-xs">${state.muted ? "🔇" : "🔊"}</button>
        </div>
      </div>

      <div class="glass-sub flex items-center justify-between px-3.5 py-2 mb-3 text-[11px]">
        <div class="flex items-center space-x-2">
          <span class="text-emerald-400">🛡</span>
          <span class="font-semibold text-slate-200">VIP Algorithm <span class="text-emerald-400 font-bold">ACTIVE</span> · WinGo 1M</span>

          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>

        <div class="glass-sub p-2.5 text-center">
          <div class="text-lg font-black text-sky-300 glow-sky">${members}</div>
          <div class="text-[9px] text-slate-300 uppercase tracking-wider font-bold">Members</div>
        </div>
        <div class="glass-sub p-2.5 text-center">
          <div class="text-lg font-black text-emerald-300">${todayWins}✓</div>
          <div class="text-[9px] text-slate-300 uppercase tracking-wider font-bold">Today Wins</div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2.5 mb-3">
        <button id="modeNumber" class="py-2.5 px-3 rounded-2xl border flex items-center justify-center space-x-2 text-xs font-bold tracking-wider uppercase relative
          ${isNumber ? 'bg-gradient-to-r from-amber-500/25 to-amber-600/25 border-amber-400/90 text-amber-300' : 'glass-sub text-slate-300'}">
          <span class="text-amber-400">●</span>
          <span>NUMBER</span>
          ${state.config.numberPredictionLocked ? `<span class="absolute -top-1.5 -right-1 px-1.5 py-0.5 rounded-md bg-rose-600 text-white text-[9px] font-bold">MAINT</span>` : ""}
        </button>
        <button id="modeBS" class="py-2.5 px-3 rounded-2xl border flex items-center justify-center space-x-2 text-xs font-bold tracking-wider uppercase relative
          ${!isNumber ? 'bg-gradient-to-r from-sky-500/30 to-indigo-600/30 border-sky-400 text-sky-200' : 'glass-sub text-slate-300'}">
          <span class="text-sky-400">▮</span>
          <span>BIG / SMALL</span>
          ${state.config.bigSmallPredictionLocked ? `<span class="absolute -top-1.5 -right-1 px-1.5 py-0.5 rounded-md bg-rose-600 text-white text-[9px] font-bold">MAINT</span>` : ""}
        </button>
      </div>

      <div class="mb-3">
        <div class="flex items-center justify-between px-1 mb-1.5">
          <label class="text-[11px] font-bold tracking-widest text-sky-400 uppercase">PERIOD NUMBER</label>
          <span class="text-[11px] text-amber-300 font-semibold">🔥 WinGo 30 Min</span>
        </div>
        <div class="glass flex items-center justify-between px-4" style="height: 52px;">
          <span class="font-mono text-xl font-bold tracking-widest ${state.period ? 'text-amber-300 glow-amber' : 'text-slate-500 text-xs font-sans'}">
            ${state.period || "Enter 4 Digits..."}
          </span>
          <span class="text-xs font-mono text-sky-300 font-bold bg-[#071324] px-2.5 py-1 rounded-lg border border-sky-500/30">
            ${state.period.length}/4
          </span>
        </div>
      </div>

      ${locked ? `
        <div class="glass p-6 text-center space-y-3.5 mb-3" style="border-color: rgba(245,158,11,0.5)">
          <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500/15 border border-amber-500/40 flex items-center justify-center text-amber-300 text-2xl">⚙</div>
          <h2 class="text-base font-bold text-white">${isNumber ? "Number" : "Big/Small"} Prediction Maintenance</h2>
          <p class="text-xs text-slate-300">Please switch to the other mode.</p>
          <button id="switchMode" class="btn-sky w-full py-3 rounded-xl text-xs uppercase">
            Switch to ${isNumber ? "BIG / SMALL" : "NUMBER"} Prediction
          </button>
        </div>
      ` : `
        <div id="resultCard" class="glass p-4 text-center cursor-pointer mb-3" style="border-color: rgba(56,189,248,0.35)">
          <div class="inline-flex items-center justify-center px-3.5 py-1 rounded-full bg-[#081528] border border-sky-500/40 text-sky-300 text-[10px] font-bold tracking-wider uppercase">
            ${state.period ? `SURESHOT · PERIOD ${state.period}` : "SURESHOT PREDICTION"}
          </div>
          <div class="py-2 flex items-center justify-center" style="min-height: 150px;">
            ${resultHTML}
          </div>
          <div class="pt-2 border-t border-sky-500/15 flex items-center justify-between text-[11px] text-slate-300 font-semibold px-1">
            <span class="flex items-center space-x-1 text-emerald-400">
              <span>⚡</span>
              <span>Accuracy: ${acc}%</span>
            </span>
            <span class="text-sky-300 text-[10px] font-mono">${p ? p.serverHash : "VIP-ALGO-V4"}</span>
          </div>
        </div>
      `}

      <div class="grid grid-cols-3 gap-2 mt-auto">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="keypad" data-key="${n}" ${locked ? "disabled" : ""}>${n}</button>`).join("")}
        <button id="delBtn" class="keypad" ${locked ? "disabled" : ""} style="background: linear-gradient(145deg,#1a0a14,#250d1a); border-color: rgba(244,63,94,0.4); color: #fda4af;">⌫</button>
        <button class="keypad" data-key="0" ${locked ? "disabled" : ""}>0</button>
        <button id="submitBtn" class="keypad" ${locked ? "disabled" : ""} style="background: linear-gradient(90deg,#fbbf24,#facc15); color:#0f172a; border-color:#fde68a; box-shadow: 0 0 18px rgba(245,158,11,0.5)">✓</button>
      </div>

      <p class="text-[10px] text-slate-500 text-center mt-3 font-mono uppercase tracking-wider">
        RAXI WIN PREDICTOR HACK 4.0
      </p>
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", () => {
    Audio.click();
    state.page = "uid";
    state.code = "";
    state.period = "";
    state.prediction = null;
    state.error = "";
    DB.clearSession();
    render();
  });
  document.getElementById("muteBtn").addEventListener("click", () => {
    state.muted = Audio.toggle();
    render();
  });
  document.getElementById("syncBtn").addEventListener("click", async () => {
    Audio.radar();
    const [stats, live] = await Promise.all([API.getStats(state.user.uid), API.getLiveStats()]);
    if (stats) state.stats = stats;
    if (live) state.liveStats = live;
    setTimeout(() => { Audio.success(); toast("✅ Synced"); render(); }, 400);
  });
  document.getElementById("modeNumber").addEventListener("click", () => {
    Audio.click();
    state.mode = "number";
    if (state.prediction) generatePrediction(state.period);
    else render();
  });
  document.getElementById("modeBS").addEventListener("click", () => {
    Audio.click();
    state.mode = "big_small";
    if (state.prediction) generatePrediction(state.period);
    else render();
  });
  const sw = document.getElementById("switchMode");
  if (sw) sw.addEventListener("click", () => {
    Audio.click();
    state.mode = isNumber ? "big_small" : "number";
    render();
  });
  document.querySelectorAll("[data-key]").forEach(btn => {
    btn.addEventListener("click", () => pressKey(btn.dataset.key));
  });
  document.getElementById("delBtn").addEventListener("click", () => {
    Audio.keypad();
    state.period = state.period.slice(0, -1);
    render();
  });
  document.getElementById("submitBtn").addEventListener("click", () => {
    if (!state.period || state.period.length < 4) {
      Audio.error(); toast("⚠ Enter 4-digit period"); return;
    }
    generatePrediction(state.period);
  });
  const rc = document.getElementById("resultCard");
  if (rc) rc.addEventListener("click", () => {
    if (!state.period) { Audio.error(); toast("⚠ Enter 4-digit period first"); return; }
    generatePrediction(state.period);
  });
}

function pressKey(k) {
  const locked = (state.mode === "number" && state.config.numberPredictionLocked) ||
                 (state.mode === "big_small" && state.config.bigSmallPredictionLocked);
  if (locked) { Audio.error(); return; }
  Audio.keypad();
  if (state.period.length < 4) state.period += k;
  else state.period = state.period.slice(1) + k;
  if (state.period.length === 4) generatePrediction(state.period);
  else render();
}

function generatePrediction(period) {
  const locked = (state.mode === "number" && state.config.numberPredictionLocked) ||
                 (state.mode === "big_small" && state.config.bigSmallPredictionLocked);
  if (locked) { Audio.error(); return; }

  const p = period || state.period || "0990";
  state.loading = true;
  render();
  Audio.radar();

  setTimeout(async () => {
    const num = Math.floor(Math.random() * 10);
    const size = Math.random() < 0.5 ? "BIG" : "SMALL";
    const color = colorForNumber(num);
    const isWin = Math.random() < 0.9;

    state.prediction = {
      period4Digit: p,
      predictedNumber: num,
      predictedColor: color,
      predictedSize: size,
      serverHash: "VIP-ALGO-V4-" + Math.random().toString(36).substring(2, 8).toUpperCase()
    };
    state.loading = false;
    Audio.success();
    render();

    if (window.confetti) {
      window.confetti({
        particleCount: 45, spread: 55, origin: { y: 0.55 },
        colors: ["#38bdf8", "#818cf8", "#f59e0b", "#ffffff", "#34d399"]
      });
    }

    await API.savePrediction({
      uid: state.user.uid,
      period: p,
      mode: state.mode,
      predictedNumber: num,
      predictedColor: color,
      predictedSize: size,
      isWin
    });

    const stats = await API.getStats(state.user.uid);
    if (stats) state.stats = stats;
  }, 700);
}

function render() {
  if (state.page === "uid") renderUID();
  else if (state.page === "predictor") renderPredictor();
}

/* INIT */
(function init() {
  const session = DB.getSession();
  if (session && session.uid) {
    const users = DB.getUsers();
    const u = users[session.uid];
    if (u && u.status === "approved") {
      state.user = u;
      state.page = "predictor";
    }
  }
  render();
})();
</script>
</body>
</html>
